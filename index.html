<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RispondiBene</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .wrapper {
      width: 100%;
      max-width: 680px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header .icon {
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 6px;
      color: #6b7280;
      font-size: 0.95rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.97rem;
      line-height: 1.6;
      color: #1a1a2e;
      resize: vertical;
      min-height: 140px;
      transition: border-color 0.2s;
      outline: none;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #6366f1;
    }

    textarea::placeholder {
      color: #c1c9d2;
    }

    .btn-generate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 14px;
    }

    .btn-generate:hover:not(:disabled) {
      background: #4f46e5;
    }

    .btn-generate:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-generate:disabled {
      background: #a5b4fc;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .output-card {
      display: none;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .output-text {
      background: #f8f9fb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.97rem;
      line-height: 1.7;
      color: #1a1a2e;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 80px;
    }

    .btn-copy {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: #f3f4f6;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .btn-copy:hover {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-copy.copied {
      background: #d1fae5;
      border-color: #6ee7b7;
      color: #065f46;
    }

    .error-box {
      display: none;
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      border-radius: 10px;
      padding: 12px 16px;
      color: #991b1b;
      font-size: 0.9rem;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="icon">🧠</div>
      <h1>RispondiBene</h1>
      <p>Incolla il messaggio ricevuto e ottieni una risposta intelligente</p>
    </header>

    <div class="card">
      <label for="input-msg">Messaggio ricevuto</label>
      <textarea
        id="input-msg"
        placeholder="Incolla qui il messaggio a cui vuoi rispondere…"
        spellcheck="true"
      ></textarea>

      <button class="btn-generate" id="generate-btn" onclick="generateResponse()">
        <span id="btn-label">✦ Genera risposta</span>
      </button>

      <div class="error-box" id="error-box"></div>
    </div>

    <div class="card output-card" id="output-card">
      <div class="output-header">
        <label style="margin:0">Risposta generata</label>
        <button class="btn-copy" id="copy-btn" onclick="copyResponse()">
          <span id="copy-label">Copia</span>
        </button>
      </div>
      <div class="output-text" id="output-text"></div>
    </div>
  </div>

  <script>
    async function generateResponse() {
      const input = document.getElementById('input-msg').value.trim();
      const errorBox = document.getElementById('error-box');
      const outputCard = document.getElementById('output-card');
      const outputText = document.getElementById('output-text');
      const btn = document.getElementById('generate-btn');
      const btnLabel = document.getElementById('btn-label');

      errorBox.style.display = 'none';
      outputCard.style.display = 'none';

      if (!input) {
        showError('Incolla prima un messaggio nel campo di testo.');
        return;
      }

      btn.disabled = true;
      btnLabel.innerHTML = '<span class="spinner"></span> Elaborazione…';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: input }),
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          showError(data.error || 'Errore nella generazione della risposta.');
          return;
        }

        outputText.textContent = data.reply;
        outputCard.style.display = 'block';
        outputCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        resetCopyBtn();
      } catch (err) {
        showError('Impossibile contattare il server. Controlla la connessione.');
      } finally {
        btn.disabled = false;
        btnLabel.textContent = '✦ Genera risposta';
      }
    }

    function copyResponse() {
      const text = document.getElementById('output-text').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copy-btn');
        const label = document.getElementById('copy-label');
        btn.classList.add('copied');
        label.textContent = '✓ Copiato!';
        setTimeout(resetCopyBtn, 2000);
      });
    }

    function resetCopyBtn() {
      const btn = document.getElementById('copy-btn');
      const label = document.getElementById('copy-label');
      btn.classList.remove('copied');
      label.textContent = 'Copia';
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg;
      box.style.display = 'block';
    }

    document.getElementById('input-msg').addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generateResponse();
    });
  </script>
</body>
</html>
